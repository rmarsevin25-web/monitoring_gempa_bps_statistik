{% extends "base.html" %}

{% block title %}Tambah Data BPS{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        ➕ Tambah Data Statistik BPS
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Provinsi
                            </label>

                            <input
                                type="text"
                                name="provinsi"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Kepadatan Penduduk
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="kepadatan"
                                class="form-control"
                                required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('home') }}"
                               class="btn btn-secondary">

                                ← Kembali

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Simpan Data

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
