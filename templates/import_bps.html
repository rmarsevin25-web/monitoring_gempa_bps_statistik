{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Import Data BPS</h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <input
                    type="file"
                    name="file"
                    class="form-control"
                    required>

                <br>

                <button class="btn btn-success">

                    Import CSV

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
